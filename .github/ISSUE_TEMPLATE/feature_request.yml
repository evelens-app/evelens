name: Feature request
description: Suggest a feature or an improvement for GridSight
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Issues are public.** Do not post ESI tokens, full log files, character names, wallet or asset information, or your location. Crop or blur screenshots before attaching them.
  - type: textarea
    id: what
    attributes:
      label: What would you like GridSight to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What is your use case?
      description: Multiboxing setup, activity (ratting, mining, abyssals, PvP…), anything that gives context.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
      description: How you handle it today, or other tools that do something similar.
